name: CI

on:
  push:
    # mvp figure dans la liste : le développement s'y fait, et la CI ne
    # s'exécutait donc jamais sur les poussées — seulement sur les pull
    # requests, c'est-à-dire jamais dans les faits.
    branches: [main, mvp]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint et compilation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci et non npm install : l'exécution doit refléter exactement le
      # package-lock.json, sinon la CI valide un arbre de dépendances qui
      # n'est pas celui du dépôt.
      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compiler
        run: npm run build

      - name: Publier le bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
